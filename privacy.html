<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2e9e6b">
<title>家庭生活管家 · 隐私政策</title>
<style>
  :root { --brand:#2e9e6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f6f8; color:#4b5563; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
  .pp-title { font-size: 22px; font-weight: 700; color:#1f2937; text-align:center; margin-bottom:6px; }
  .pp-update { font-size: 12px; color:#9aa5b4; text-align:center; margin-bottom:22px; }
  .pp-h { font-size: 16px; font-weight: 700; color:#1f2937; margin: 22px 0 8px; }
  .pp-p { font-size: 14px; line-height: 1.85; margin-bottom: 6px; }
  .pp-foot { margin-top: 30px; font-size: 12px; color:#9aa5b4; text-align:center; line-height:1.7; }
  a { color:#4a90d9; }
</style>
</head>
<body>
<div class="wrap" id="root">加载中…</div>

<script>
/* 与小程序 / 网页版同源的隐私政策正文 */
var SECTIONS = [
  {h:'一、我们收集的信息',p:[
    '账号与设备标识：通过微信登录获取您的 OpenID / UnionID，用于识别身份、实现多端数据同步。',
    '您主动录入的数据：菜市场物价、每周食谱规划、食材采购清单、每日消费金额与自定义分类等家庭记账内容。',
    '使用统计：启动时长、功能使用情况等匿名聚合数据，用于改进体验。'
  ]},
  {h:'二、我们如何使用信息',p:[
    '为您提供菜价维护、成本自动核算、消费统计等核心功能；',
    '数据默认优先存储于您的本地设备，云同步仅用于跨设备访问；',
    '匿名聚合统计用于产品优化，不会针对到具体个人。'
  ]},
  {h:'三、信息的存储与保护',p:[
    '数据默认存储于您的微信云开发空间或本地存储；传输全程采用 HTTPS 加密。',
    '我们按用户标识做访问隔离，并采取必要技术措施保护您的信息安全。'
  ]},
  {h:'四、信息的共享',p:[
    '我们不会向任何第三方出售您的个人信息。',
    '仅在以下情形披露：您另行明确授权、或法律法规及监管部门要求。'
  ]},
  {h:'五、您的权利',p:[
    '查阅与更正：您可随时在应用内查看并修改自己的记录；',
    '删除：可删除单条记录或全部数据，满足《个人信息保护法》项下的"被遗忘权"；',
    '撤回同意：您可通过清除授权或卸载应用撤回同意，撤回后我们将停止进一步收集，并按您的请求删除已存储数据。'
  ]},
  {h:'六、未成年人保护',p:['本应用不专门面向未成年人；若您为未成年人，请在监护人指导下使用。']},
  {h:'七、联系我们',p:['如对本政策有任何疑问，可通过应用内反馈或开发者联系方式与我们沟通。']},
  {h:'八、政策更新',p:['本政策可能不时更新，涉及重大变更时我们会通过应用内公告告知。']}
];
var html = '<div class="pp-title">家庭生活管家 · 隐私政策</div>' +
  '<div class="pp-update">最近更新：2026-10-15</div>';
SECTIONS.forEach(function(sec){
  html += '<div class="pp-h">'+sec.h+'</div>';
  sec.p.forEach(function(para){ html += '<div class="pp-p">'+para+'</div>'; });
});
html += '<div class="pp-foot">如对本政策有疑问，可通过应用内反馈联系我们。</div>';
document.getElementById('root').innerHTML = html;
</script>
</body>
</html>
